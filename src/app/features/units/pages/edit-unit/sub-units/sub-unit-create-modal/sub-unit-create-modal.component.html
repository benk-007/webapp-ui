
<div class="modal-header">
  <h5 class="modal-title">{{ 'units.create-multi-unit.form.add-subunit.label'|translate }}</h5>
</div>

<div class="modal-body">
  <form [formGroup]="subUnitsForm" (ngSubmit)="onSubmit()" cForm>

    <!-- New Subunits Section -->
    <c-row *ngIf="newSubUnits.length > 0">
      <c-col md="12">
        <div formArrayName="newSubUnits">
          <div *ngFor="let subUnit of newSubUnits.controls; let i = index" [formGroupName]="i" class="mb-3">
            <c-row>
              <!-- Subunit Name -->
              <c-col md="5" class="mb-3">
                <label cLabel class="required me-2">
                  {{ 'units.create-multi-unit.form.subunit-name.label'|translate }}
                </label>
                <input cFormControl formControlName="name" type="text"
                       [placeholder]="'units.create-multi-unit.form.subunit-name.placeholder'|translate"/>
                <c-form-feedback *ngIf="((subUnit.get('name')?.touched || subUnit.get('name')?.dirty) && subUnit.get('name')?.hasError('required'))" [valid]="false">
                  {{ 'commons.errors.required'|translate }}
                </c-form-feedback>
              </c-col>

              <!-- Priority -->
              <c-col md="4" class="mb-3">
                <label cLabel class="required me-2">
                  {{ 'units.create-multi-unit.form.priority.label'|translate }}
                </label>
                <input cFormControl formControlName="priority" type="number" min="1" max="99"/>
                <c-form-feedback *ngIf="((subUnit.get('priority')?.touched || subUnit.get('priority')?.dirty) && subUnit.get('priority')?.hasError('required'))" [valid]="false">
                  {{ 'commons.errors.required'|translate }}
                </c-form-feedback>
              </c-col>

              <!-- Status Toggle -->
              <c-col md="2" class="mb-3 d-flex flex-column justify-content-center">
                <label cLabel class="me-2">{{ 'units.create-multi-unit.form.status.label'|translate }}</label>
                <c-form-check [switch]="true">
                  <input cFormCheckInput formControlName="readiness" type="checkbox" [id]="'status-' + i"/>
                  <label cFormCheckLabel [for]="'status-' + i">
                    {{ 'units.unit-list.table.body.ready'|translate }}
                  </label>
                </c-form-check>
              </c-col>

              <!-- Remove Button -->
              <c-col md="1" class="mb-3 d-flex align-items-end justify-content-center">
                <button cButton size="sm" color="danger" class="btn-light"
                        (click)="removeNewSubUnit(i)" type="button">
                  <svg [cIcon]="icons.cilTrash" size="sm"></svg>
                </button>
              </c-col>
            </c-row>
          </div>
        </div>
      </c-col>
    </c-row>

    <!-- Add New Subunit Link -->
    <c-row>
      <c-col md="12">
        <span class="add-subunit-link" (click)="addNewSubUnit()">
          <i class="bi bi-plus me-1"></i>
          {{ 'units.create-multi-unit.form.add-subunit.label'|translate }}
        </span>
      </c-col>
    </c-row>

    <!-- Message if no subunits -->
    <c-row *ngIf="newSubUnits.length === 0" class="mt-3">
      <c-col md="12">
        <div class="text-center text-muted">
          <p>{{ 'Click "Add SubUnit" to create your first subunit'|translate }}</p>
        </div>
      </c-col>
    </c-row>

  </form>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="closeModal()" [disabled]="isSubmitting">
    {{ 'commons.form.buttons.cancel'|translate }}
  </button>
  <button type="button" class="btn btn-primary" (click)="onSubmit()"
          [disabled]="newSubUnits.length === 0 || !isFormValid() || isSubmitting">
    <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-2"></span>
    {{ isSubmitting ? ('commons.snippets.loading'|translate) + '...' : ('commons.form.buttons.create'|translate) + ' SubUnit(s)' }}
  </button>
</div>
