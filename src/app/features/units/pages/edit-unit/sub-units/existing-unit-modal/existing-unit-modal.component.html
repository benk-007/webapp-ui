<div class="modal-header">
  <h5 class="modal-title">Add Existing Units as SubUnits</h5>
</div>

<div class="modal-body">
  <form [formGroup]="assignForm" (ngSubmit)="onSubmit()" cForm>

    <c-row>
      <c-col [md]="12" class="mb-3">
        <label cLabel class="required">Select Units</label>
        <app-unit-select
          formControlName="selectedUnits"
          [allowMultiUnit]="false">
        </app-unit-select>
        <c-form-feedback
          *ngIf="assignForm.get('selectedUnits')?.hasError('required') && assignForm.get('selectedUnits')?.touched"
          [valid]="false">
          Please select at least one unit
        </c-form-feedback>
      </c-col>
    </c-row>

  </form>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="closeModal()" [disabled]="isSubmitting">
    Cancel
  </button>
  <button type="button" class="btn btn-primary" (click)="onSubmit()" [disabled]="assignForm.invalid || isSubmitting">
    <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-2"></span>
    {{ isSubmitting ? 'Assigning...' : 'Assign Units' }}
  </button>
</div>
